<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2357d5"><title>英文單字測驗</title>
<style>
:root{--b:#2357d5;--ink:#172033;--muted:#657087;--line:#e1e6f0;--bg:#f4f6fb;--green:#16845b;--red:#c53c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#1945b5,#4778ed);color:white;padding:22px max(18px,calc((100% - 980px)/2))}header h1{font-size:25px;margin:0 0 5px}header p{margin:0;opacity:.88;font-size:14px}main{max-width:980px;margin:18px auto;padding:0 14px 40px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:white;color:#4a556a;padding:11px 15px;border-radius:12px;font-weight:700;cursor:pointer}.tab.active{background:var(--b);border-color:var(--b);color:white}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #1d2a4810}.hidden{display:none!important}.section-title{font-size:19px;margin:0 0 14px}.muted{color:var(--muted);font-size:14px}.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 16px}.week{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:10px;border-radius:10px;background:#fff}.week input{accent-color:var(--b);width:17px;height:17px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--b);color:#fff}.btn.secondary{background:#eef2ff;color:#2349b4}.btn.gray{background:#eef0f5;color:#39445a}.btn:disabled{opacity:.45;cursor:not-allowed}#quizArea{text-align:center}.progress{height:7px;background:#edf0f6;border-radius:10px;overflow:hidden;margin:10px 0 20px}.progress div{height:100%;background:var(--b);width:0;transition:width .2s}.big{font-size:clamp(25px,5vw,40px);font-weight:800;margin:22px 0 8px}.answer-input{font-size:20px;padding:13px 14px;width:min(100%,400px);border:1px solid #cdd5e4;border-radius:10px;text-align:center;margin:12px 0}.feedback{min-height:26px;font-weight:700;margin:6px 0}.ok{color:var(--green)}.bad{color:var(--red)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f6f8fc;color:#46516a}.pill{display:inline-block;border-radius:20px;padding:3px 8px;font-size:12px;background:#eef2ff;color:#2349b4}.empty{padding:25px;text-align:center;color:var(--muted)}.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select{padding:9px 10px;border:1px solid #cdd5e4;border-radius:9px;background:white;color:var(--ink)}@media(max-width:560px){header{padding:18px}header h1{font-size:22px}.panel{padding:14px}.tab{flex:1;padding:10px 7px;font-size:13px}th,td{padding:9px 7px}}
</style></head><body><header><h1>英文單字測驗</h1><p>選擇週次開始聽力拼字測驗，並查看答錯率與每次考試紀錄。</p></header><main>
<nav class="tabs"><button class="tab active" data-tab="test">📝 測驗</button><button class="tab" data-tab="stats">📊 學習統計</button><button class="tab" data-tab="history">🗂️ 學習狀況</button></nav>
<section id="test" class="panel"><h2 class="section-title">選擇測驗週次</h2><div class="muted">可複選週次。開始後會播放英文發音，請輸入聽到的單字或片語。不顯示中文意思。</div><div id="weekChecks" class="weeks"></div><div class="actions"><button class="btn secondary" id="selectAll">全選</button><button class="btn gray" id="clearAll">清除選取</button><button class="btn" id="startBtn">開始測驗</button></div></section>
<section id="quizArea" class="panel hidden"><div class="filter-row" style="justify-content:space-between"><span id="quizLabel" class="pill"></span><span id="counter" class="muted"></span></div><div class="progress"><div id="progressBar"></div></div><div class="big" id="prompt">聽發音，輸入單字</div><div class="muted" id="promptHint">按喇叭播放發音，再輸入答案</div><button class="btn secondary" id="speakBtn">🔊 播放發音</button><br><input id="answer" class="answer-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="輸入英文單字或片語"><div><button class="btn" id="submitBtn">確認答案</button><button class="btn gray hidden" id="nextBtn">下一題 →</button></div><div id="feedback" class="feedback"></div></section>
<section id="resultArea" class="panel hidden"><h2 class="section-title">本次測驗完成</h2><div id="resultSummary"></div><div class="actions" style="margin-top:14px"><button class="btn" id="retryBtn">再測一次</button><button class="btn secondary" id="toHistoryBtn">查看學習狀況</button></div><div class="table-wrap" style="margin-top:15px" id="resultTable"></div></section>
<section id="stats" class="panel hidden"><h2 class="section-title">學習統計</h2><div class="filter-row"><label for="statsWeek">顯示週次</label><select id="statsWeek"><option value="all">全部週次</option></select><span class="muted">依答錯率由高至低排列</span></div><div class="table-wrap" id="statsTable"></div></section>
<section id="history" class="panel hidden"><h2 class="section-title">學習狀況</h2><p class="muted">依考試時間由新到舊排列；每次考試內的單字依答錯率由高至低顯示。</p><div id="historyList"></div></section></main>
<script>
const groups=[
{label:"Week 1 & 2",words:["lost","kitten","whisper","promise","cover","nervous","lead / led","beside","familiar","lie / lay"]},
{label:"Week 3",words:["begin / began","understand / understood","take / took","while","confident","recess","crunching","edge","imagine","sight"]},
{label:"Week 4",words:["peep","gap","whoever","fence","spot","seem","shiver","either","breath","puzzled"]},
{label:"Week 5 & 6",words:["neighborhood","freeze / froze","owner","paw","van","should","announcement","address","receive","hand"]},
{label:"Week 7",words:["few","reward","set up","anytime","sincerely","whole","cheer","rescue","entire","bunch"]},
{label:"Week 10",words:["underground","nature","dig / dug","burrow","tunnel","crowd","especially","rich","section","muscle"]},
{label:"Week 11",words:["cover","tiny","hide / hid","predator","dead","important","waste","nutrient","mammal","shovel"]},
{label:"Week 12 & 13",words:["nearly","blind","instead of","sense","meal","throughout","lay / laid","hatch","surface","spend / spent"]},
{label:"Week 14 & 15",words:["hunt","area","endangered","chemical","active","as if","about","partly","treeless","inch"]},
{label:"Week 16 & 17",words:["distance","during","bright","eyesight","benefit","survive","adult","form","closely","sign"]}];
const STORE='vocab_quiz_stats_v2',HISTORY='vocab_quiz_history_v2';let stats=JSON.parse(localStorage.getItem(STORE)||'{}'),history=JSON.parse(localStorage.getItem(HISTORY)||'[]'),questions=[],index=0,answers=[],currentDone=false,lastSelection=[];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[’']/g,"'");
function save(){localStorage.setItem(STORE,JSON.stringify(stats));localStorage.setItem(HISTORY,JSON.stringify(history))}
function rate(x){return x.correct+x.wrong?x.wrong/(x.correct+x.wrong):0}
function buildWeeks(){$('weekChecks').innerHTML=groups.map((g,i)=>`<label class="week"><input type="checkbox" value="${i}" checked><span>${esc(g.label)}</span></label>`).join('');$('statsWeek').innerHTML='<option value="all">全部週次</option>'+groups.map(g=>`<option value="${esc(g.label)}">${esc(g.label)}</option>`).join('')}
function selectedGroups(){return [...document.querySelectorAll('#weekChecks input:checked')].map(x=>groups[+x.value])}
function speak(w){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放，請使用 Safari 或 Chrome。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.replace(/\s*\/\s*/g,' or '));u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}
function showTab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['test','stats','history'].forEach(id=>$(id).classList.toggle('hidden',id!==t));if(t==='stats')renderStats();if(t==='history')renderHistory()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('selectAll').onclick=()=>document.querySelectorAll('#weekChecks input').forEach(x=>x.checked=true);$('clearAll').onclick=()=>document.querySelectorAll('#weekChecks input').forEach(x=>x.checked=false);
function startTest(){let gs=selectedGroups();if(!gs.length){alert('請至少選擇一個週次。');return}lastSelection=gs.map(g=>g.label);questions=gs.flatMap(g=>g.words.map(word=>({week:g.label,word}))).sort(()=>Math.random()-.5);index=0;answers=[];currentDone=false;$('resultArea').classList.add('hidden');$('quizArea').classList.remove('hidden');$('startBtn').disabled=true;renderQuestion();setTimeout(()=>speak(questions[0].word),300)}
$('startBtn').onclick=startTest;
function renderQuestion(){let q=questions[index];currentDone=false;$('quizLabel').textContent=q.week;$('counter').textContent=`第 ${index+1} / ${questions.length} 題`;$('progressBar').style.width=(index/questions.length*100)+'%';$('prompt').textContent='聽發音，輸入單字';$('promptHint').textContent='例如 lead / led，請輸入完整字詞組（含斜線）';$('answer').value='';$('answer').disabled=false;$('submitBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden');$('feedback').textContent='';$('feedback').className='feedback';$('answer').focus()}
$('speakBtn').onclick=()=>questions[index]&&speak(questions[index].word);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){currentDone?nextQuestion():checkAnswer()}});$('submitBtn').onclick=checkAnswer;$('nextBtn').onclick=nextQuestion;
function checkAnswer(){if(currentDone)return;let typed=norm($('answer').value);if(!typed){$('feedback').textContent='請先輸入答案。';return}let q=questions[index],correct=typed===norm(q.word);answers.push({...q,correct,typed});let k=q.week+'||'+q.word,s=stats[k]||{week:q.week,word:q.word,correct:0,wrong:0};if(correct)s.correct++;else s.wrong++;stats[k]=s;save();currentDone=true;$('answer').disabled=true;$('submitBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('feedback').className='feedback '+(correct?'ok':'bad');$('feedback').textContent=correct?'✓ 答對了！':`✗ 正確答案：${q.word}`;$('progressBar').style.width=((index+1)/questions.length*100)+'%'}
function nextQuestion(){if(!currentDone)return;if(index<questions.length-1){index++;renderQuestion();setTimeout(()=>speak(questions[index].word),250)}else finishTest()}
function table(cols,rows){if(!rows.length)return '<div class="empty">目前沒有資料</div>';return '<table><thead><tr>'+cols.map(c=>`<th>${c.h}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>`<td>${esc(c.v(r))}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
function finishTest(){let total=answers.length,correct=answers.filter(x=>x.correct).length,exam={id:Date.now(),date:new Date().toISOString(),weeks:lastSelection,answers:answers.map(x=>({...x})),total,correct,wrong:total-correct};history.unshift(exam);save();$('quizArea').classList.add('hidden');$('resultArea').classList.remove('hidden');$('startBtn').disabled=false;$('resultSummary').innerHTML=`<div class="big">${Math.round(correct/total*100)}%</div><p>共 ${total} 題　答對 <b class="ok">${correct}</b> 題　答錯 <b class="bad">${total-correct}</b> 題</p>`;$('resultTable').innerHTML=table([{h:'週次',v:x=>x.week},{h:'單字',v:x=>x.word},{h:'結果',v:x=>x.correct?'答對':'答錯'},{h:'本次答錯率',v:x=>x.correct?'0%':'100%'}],[...answers].sort((a,b)=>Number(a.correct)-Number(b.correct)));renderStats();renderHistory()}
$('retryBtn').onclick=()=>{$('resultArea').classList.add('hidden');startTest()};$('toHistoryBtn').onclick=()=>showTab('history');
function renderStats(){let w=$('statsWeek').value||'all',rows=Object.values(stats).filter(x=>w==='all'||x.week===w).map(x=>({...x,attempts:x.correct+x.wrong,wrongRate:rate(x)})).filter(x=>x.attempts).sort((a,b)=>b.wrongRate-a.wrongRate||b.wrong-a.wrong||a.word.localeCompare(b.word));$('statsTable').innerHTML=table([{h:'週次',v:x=>x.week},{h:'單字',v:x=>x.word},{h:'測驗次數',v:x=>x.attempts},{h:'答對',v:x=>x.correct},{h:'答錯',v:x=>x.wrong},{h:'答錯率',v:x=>Math.round(x.wrongRate*100)+'%'}],rows)}
$('statsWeek').onchange=renderStats;
function renderHistory(){if(!history.length){$('historyList').innerHTML='<div class="empty">尚無測驗紀錄。完成第一次測驗後，紀錄會顯示在這裡。</div>';return}$('historyList').innerHTML=history.map(e=>{let dt=new Date(e.date).toLocaleString('zh-TW',{hour12:false}),rows=[...e.answers].sort((a,b)=>Number(a.correct)-Number(b.correct));return `<details class="panel" style="margin:0 0 12px;padding:13px"><summary style="cursor:pointer;font-weight:700;line-height:1.8">${dt}　<span class="pill">${esc(e.weeks.join('、'))}</span><br><span class="muted">共 ${e.total} 題｜答對 ${e.correct}｜答錯 ${e.wrong}｜正確率 ${Math.round(e.correct/e.total*100)}%</span></summary><div class="table-wrap" style="margin-top:12px">${table([{h:'週次',v:x=>x.week},{h:'單字',v:x=>x.word},{h:'結果',v:x=>x.correct?'答對':'答錯'},{h:'本次答錯率',v:x=>x.correct?'0%':'100%'}],rows)}</div></details>`}).join('')}
buildWeeks();renderStats();renderHistory();
</script></body></html>
