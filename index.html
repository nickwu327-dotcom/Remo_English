<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>葉葉的單字庫</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f5ff;--bg2:#fff4e0;--fg:#2b3350;--card:#fff;--pri:#4f8cff;--pri2:#2f6be0;--acc:#ff9f43;--bd:#bfd9f5;--ok:#1fa85a;--bad:#e8505b;--chip:#f0f7ff;--mut:#5b6685}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2238;--bg2:#2a2236;--fg:#eef1fb;--card:#262f4a;--pri:#6fa0ff;--pri2:#4f86f0;--acc:#ffb066;--bd:#43507a;--ok:#4cd68a;--bad:#ff7b84;--chip:#2f3a5c;--mut:#a9b4d3}}
:root[data-theme="dark"]{--bg:#1b2238;--bg2:#2a2236;--fg:#eef1fb;--card:#262f4a;--pri:#6fa0ff;--pri2:#4f86f0;--acc:#ffb066;--bd:#43507a;--ok:#4cd68a;--bad:#ff7b84;--chip:#2f3a5c;--mut:#a9b4d3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:14px}
.hero{text-align:center;font-size:30px;font-weight:800;color:var(--pri2);margin:4px 0 12px;letter-spacing:2px}
.hero span{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(8deg)}}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
nav button{padding:11px 6px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:18px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--bd);font-family:inherit}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri2);box-shadow:0 4px 0 var(--pri2)}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 6px 0 var(--bd)}
.card b{font-size:20px;color:var(--pri2)}
.weeks{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}
.weeks label{border:3px solid var(--bd);background:var(--chip);border-radius:999px;padding:7px 16px;cursor:pointer;user-select:none;font-weight:700}
.weeks label.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.weeks label.on::before{content:"✓ "}
.weeks input{display:none}
button.b{padding:12px 22px;border:0;border-radius:16px;background:var(--pri);color:#fff;font-size:19px;font-weight:800;cursor:pointer;margin:4px 6px 4px 0;box-shadow:0 5px 0 var(--pri2);font-family:inherit}
button.b:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri2)}
button.b.g{background:var(--card);color:var(--fg);border:3px solid var(--bd);box-shadow:0 4px 0 var(--bd);padding:9px 16px;font-size:17px}
#qstart{background:var(--ok);box-shadow:0 5px 0 rgba(0,0,0,.2);font-size:22px;padding:14px 28px}
#qrestart{border-color:var(--acc);color:var(--acc)}
#qsub{font-size:24px;padding:14px 32px;background:var(--acc);box-shadow:0 5px 0 rgba(0,0,0,.2)}
input[type=text],input[type=date],select{font-family:inherit;color:var(--fg);background:var(--chip);border:4px solid var(--bd);border-radius:18px;box-sizing:border-box;outline:none}
input[type=text]{font-size:30px;padding:14px;width:100%;text-align:center}
input[type=text]:focus{border-color:var(--pri)}
input[type=date]{font-size:16px;padding:6px 10px;border-width:3px;border-radius:12px}
select{font-size:17px;padding:10px 12px;width:100%;margin:6px 0 16px;border-width:3px}
input[type=checkbox]{width:22px;height:22px;vertical-align:middle;accent-color:var(--acc)}
.big{text-align:center;margin:10px 0}
#qplay{font-size:26px;padding:16px 32px;border-radius:999px}
#qdesc{background:var(--chip);border:3px dashed var(--pri);padding:16px 18px;border-radius:20px;font-size:21px;margin:12px 0;line-height:1.5;font-weight:600}
.fb{text-align:center;font-size:24px;font-weight:800;min-height:34px;margin:12px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hide{display:none!important}
.miss{color:var(--ok);font-weight:800;text-decoration:underline}.extra{color:var(--bad);text-decoration:line-through}
.fb div{margin:6px 0;font-size:26px;letter-spacing:1px;font-weight:700}
.fb .ph{font-size:20px;letter-spacing:0;opacity:.8}
.fb .muted{font-size:14px;letter-spacing:0;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:17px;margin-top:8px}
th{background:var(--chip);color:var(--pri2)}
th,td{padding:9px 10px;border-bottom:2px dashed var(--bd);text-align:left}
.sc{overflow-x:auto}
.muted{opacity:.75;font-size:15px}
h4{font-size:22px;color:var(--pri2)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--bd)}
.row .w{font-size:24px;font-weight:800;min-width:140px}.row .p{flex:1;opacity:.75;font-size:19px}
.row .zhx{flex-basis:100%;order:5}.row .zhx div{margin:2px 0;color:var(--pri2);font-weight:700;font-size:17px}
.pos{display:inline-block;font-size:13px;background:var(--acc);color:#fff;border-radius:999px;padding:0 10px;margin-right:8px;font-weight:700}
.bar{height:18px;background:var(--chip);border:3px solid var(--bd);border-radius:999px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));border-radius:999px;transition:width .3s}
@media(max-width:480px){.hero{font-size:24px}.wrap{padding:10px}.row .w{min-width:100px;font-size:21px}nav button{font-size:15px}}
</style></head><body><div class="wrap">
<div class="hero"><span>🌟</span> 葉葉的單字庫 <span>🚀</span></div>
<nav id="nav"></nav>

<section id="s0"><div id="qmode" class="muted" style="margin:0 0 8px"></div><div class="card">
<b>選擇單字表</b><div class="weeks" id="qset"></div><b>選擇測驗週次</b> <span class="muted" id="cwq"></span>
<div class="weeks" id="qw"></div>
<button class="b g" id="qprev">勾選前週及當週</button><button class="b g" id="qall">全選</button><button class="b g" id="qnone">全不選</button>
<label style="display:block;margin:8px 0"><input type="checkbox" id="qwrong"> 錯題重複練習 <span class="muted">(從答錯的題目出題;沒有錯題則從所選週次隨機出題)</span></label>
<div style="display:flex;justify-content:space-between;gap:120px;align-items:center;margin-top:6px"><button class="b" id="qstart" style="margin:0">🚀 開始測驗</button><button class="b g" id="qrestart" style="margin:0">🔄 重新開始</button></div>
<div id="qmsg" class="bad" style="margin-top:8px"></div>
</div>
<div class="card hide" id="qbox">
<div class="muted" id="qnote"></div><div class="muted" id="qprog"></div><div class="bar"><i id="qbar" style="width:0"></i></div>
<div id="qdesc" class="hide"></div>
<div class="big"><button class="b" id="qplay">🔊 聽發音</button></div>
<input type="text" id="qin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入英文單字後按 Enter">
<div class="fb" id="qfb"></div>
<div><button class="b" id="qsub">✅ 確認答案</button></div></div>
<div class="card hide" id="qend"><b id="qsum"></b><div style="margin-top:8px"><button class="b" id="qretry">💪 錯題重複練習</button></div></div>
</section>

<section id="s1" class="hide"><div class="card"><b>選擇單字表</b><div class="weeks" id="sset"></div><b>選擇週次</b><div class="weeks" id="sw"></div>
<button class="b g" id="sall">全選</button><button class="b g" id="snone">全不選</button>
<div style="margin-top:8px" class="muted">測驗開始日期:<input type="date" id="d1"> ~ <input type="date" id="d2"></div></div>
<div class="card sc" id="sout"></div></section>

<section id="s2" class="hide"><div id="lout"></div></section>

<section id="s3" class="hide"><div class="card"><b>選擇單字表</b><div class="weeks" id="rset"></div><b>選擇週次</b> <span class="muted" id="cwr"></span><div class="weeks" id="rw"></div></div>
<div class="card" id="rout"></div></section>

<section id="s4" class="hide"><div class="card"><b>發音口音</b><div class="weeks" id="stlang"></div>
<b>發音聲音</b><div><select id="stvoice"></select></div>
<b>語速</b> <span class="muted">(1 最慢 ~ 5 最快,預設 2)</span><div class="weeks" id="strate"></div>
<button class="b" id="sttest">🔊 試聽</button><div class="muted" id="stnote" style="margin-top:6px"></div></div>
<div class="card sc"><b>本機可用的英文聲音</b><div class="muted" id="stallnote" style="margin:4px 0"></div><div id="stall"></div></div></section>
</div>

$("cwr").textContent="(目前第 "+CUR+" 週,已自動勾選前週及當週)";
function review(){const ids=order(rSel);
 $("rout").innerHTML=ids.length?ids.map(id=>`<h4 style="margin:10px 0 0">${GM[id].label}</h4>`+GM[id].words.map((x,i)=>`<div class="row"><span class="w">${x.w}</span><span class="p">${x.p?"/"+x.p+"/":""}</span><button class="b g" data-s="${id}|${i}">🔊</button><div class="zhx">${zh(x.w)}</div></div>`).join("")).join(""):'<span class="muted">請選擇週次</span>'}
$("rout").onclick=e=>{const s=e.target.dataset&&e.target.dataset.s;if(s){const[g,i]=s.split("|");speak(GM[g].words[i].w)}};
function stRender(){chips("stlang",LANGS,k=>k===ST.lang,k=>{ST.lang=k;ST.voice="";saveST();stRender()});
 chips("strate",[1,2,3,4,5].map(n=>[n,String(n)]),k=>k===(+ST.lv||2),k=>{ST.lv=k;saveST();stRender()});
 const vs=getVoices().filter(x=>nl(x)===ST.lang),sel=$("stvoice");
 sel.innerHTML='<option value="">自動(系統預設)</option>'+vs.map(v=>`<option value="${v.voiceURI.replace(/"/g,"&quot;")}">${v.name}</option>`).join("");sel.value=ST.voice;
 const all=getVoices(),en=all.filter(x=>nl(x).toLowerCase().startsWith("en")).sort((a,b)=>nl(a).localeCompare(nl(b))||a.name.localeCompare(b.name));
 $("stallnote").textContent=`本機共 ${all.length} 個聲音,其中英文 ${en.length} 個。目前網站可選口音:美式、英式、澳洲、加拿大。`;
 $("stall").innerHTML=en.length?`<table><tr><th>口音(語言代碼)</th><th>聲音名稱</th><th>類型</th></tr>`+en.map(v=>`<tr><td>${nl(v)}</td><td>${v.name}</td><td>${v.localService?"本機":"線上"}</td></tr>`).join("")+"</table>":'<span class="muted">沒有偵測到英文聲音(部分瀏覽器需要稍等幾秒載入,請重新進入設定頁)</span>';
 $("stnote").textContent=vs.length?`此裝置有 ${vs.length} 個「${LANGS.find(x=>x[0]===ST.lang)[1]}」聲音可選`:"此裝置沒有這個口音的專用聲音,會改用系統預設英語聲音(可能聽不出差異)"}
$("stvoice").onchange=e=>{ST.voice=e.target.value;saveST()};
$("sttest").onclick=()=>speak("Hello! Apple, banana, neighbor, vocabulary.");
try{speechSynthesis.onvoiceschanged=()=>{if(!$("s4").classList.contains("hide"))stRender()}}catch(e){}
rRender();show(0);
</script></body></html>
