<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的英文單字複習</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:#f4f6f8;color:#222}
header{background:#243447;color:white;padding:18px 22px}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;opacity:.85}
.container{max-width:1050px;margin:20px auto;padding:0 15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button,.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-size:15px;background:#e2e8f0}
.tabs button.active,.btn.primary{background:#2563eb;color:white}
.btn.green{background:#16a34a;color:white}
.btn.red{background:#dc2626;color:white}
.btn.orange{background:#ea580c;color:white}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:white;border-radius:16px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.08);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.week-card{border:2px solid #e5e7eb;border-radius:14px;padding:18px;cursor:pointer;background:white}
.week-card:hover{border-color:#2563eb}
.word{font-size:42px;font-weight:700;text-align:center;margin:20px 0 10px}
.meaning{font-size:24px;text-align:center;color:#475569;margin-bottom:20px}
.example{text-align:center;color:#64748b;font-size:18px;margin:12px}
.center{text-align:center}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 20px}
.progress div{height:100%;background:#2563eb}
.big-btn{font-size:18px;padding:13px 22px;border-radius:12px;border:0;cursor:pointer}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:650px;margin:20px auto}
.answer{padding:15px;border:2px solid #dbe2ea;border-radius:12px;background:white;cursor:pointer;font-size:17px}
.answer:hover{border-color:#2563eb}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}
label{display:block;margin-bottom:6px;font-weight:600}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}
.small{font-size:13px;color:#64748b}
.stat{font-size:28px;font-weight:700}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e0f2fe;color:#0369a1;font-size:12px}
.hidden{display:none!important}
.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af;margin-bottom:15px}
@media(max-width:650px){.word{font-size:34px}.answers{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.container{margin-top:10px}}
</style>
</head>
<body>
<header>
<h1>📚 我的英文單字複習</h1>
<p>每週單字・發音・測驗・錯題複習</p>
</header>
<div class="container">
<div class="tabs">
<button class="active" onclick="showTab('learn',this)">📖 開始複習</button>
<button onclick="showTab('manage',this)">📝 單字管理</button>
<button onclick="showTab('stats',this)">📊 學習統計</button>
</div>

<section id="learn">
<div id="weekSelect" class="card">
<h2>選擇學習週</h2>
<div id="weeks" class="grid"></div>
</div>
<div id="quiz" class="card hidden"></div>
</section>

<section id="manage" class="hidden">
<div class="card">
<h2>新增單字</h2>
<div class="form-row">
<div><label>Week</label><input id="newWeek" placeholder="例如：Week 1"></div>
<div><label>英文單字</label><input id="newWord" placeholder="例如：apple"></div>
</div>
<div class="form-row">
<div><label>中文意思</label><input id="newChinese" placeholder="例如：蘋果"></div>
<div><label>例句（可不填）</label><input id="newExample" placeholder="例如：I eat an apple."></div>
</div>
<button class="btn primary" onclick="addWord()">＋ 新增單字</button>
<button class="btn" onclick="addDemo()">載入範例單字</button>
</div>
<div class="card">
<h2>目前單字庫</h2>
<div id="wordTable"></div>
</div>
</section>

<section id="stats" class="hidden">
<div class="card">
<h2>學習統計</h2>
<div id="statsContent"></div>
</div>
</section>
</div>

<script>
const STORAGE_KEY='my_vocab_v1';
const RECORD_KEY='my_vocab_records_v1';

let words=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null') || [];
let records=JSON.parse(localStorage.getItem(RECORD_KEY)||'{}');
let currentWeek='';
let quizWords=[];
let quizIndex=0;
let score=0;
let mode='flash';

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(words));localStorage.setItem(RECORD_KEY,JSON.stringify(records));}

function showTab(id,btn){
 document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');
 if(id==='learn') renderWeeks();
 if(id==='manage') renderTable();
 if(id==='stats') renderStats();
}

function renderWeeks(){
 const box=document.getElementById('weeks');
 const weeks=[...new Set(words.map(x=>x.week))];
 if(!weeks.length){box.innerHTML='<div class="notice">目前沒有單字。請到「單字管理」新增，或載入範例單字。</div>';return;}
 box.innerHTML=weeks.map(w=>{
   const n=words.filter(x=>x.week===w).length;
   return `<div class="week-card" onclick="startWeek('${escapeJs(w)}')"><h3>📘 ${escapeHtml(w)}</h3><p>${n} 個單字</p><button class="btn primary">開始複習</button></div>`;
 }).join('');
}

function startWeek(week){
 currentWeek=week;
 quizWords=shuffle(words.filter(x=>x.week===week));
 quizIndex=0;score=0;mode='flash';
 document.getElementById('weekSelect').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 renderQuiz();
}

function renderQuiz(){
 const q=document.getElementById('quiz');
 if(quizIndex>=quizWords.length){finishQuiz();return;}
 const w=quizWords[quizIndex];
 const pct=Math.round((quizIndex/quizWords.length)*100);
 q.innerHTML=`
 <div class="small">${escapeHtml(currentWeek)}　${quizIndex+1} / ${quizWords.length}</div>
 <div class="progress"><div style="width:${pct}%"></div></div>
 <div class="center">
   <div class="word">${escapeHtml(w.word)}</div>
   <button class="big-btn btn orange" onclick="speak('${escapeJs(w.word)}')">🔊 聽發音</button>
   <div class="meaning">${escapeHtml(w.chinese)}</div>
   ${w.example?`<div class="example">${escapeHtml(w.example)}</div>`:''}
   <div style="margin:20px 0">
    <button class="btn green" onclick="answer(true)">✓ 我會</button>
    <button class="btn red" onclick="answer(false)">✗ 不會</button>
   </div>
 </div>
 <hr>
 <div class="center">
  <button class="btn" onclick="startTest('choice')">🎯 四選一</button>
  <button class="btn" onclick="startTest('spell')">✍️ 英文拼字</button>
  <button class="btn" onclick="startTest('listen')">👂 聽寫</button>
 </div>
 <div class="center" style="margin-top:20px"><button class="btn" onclick="backToWeeks()">← 回到選擇週</button></div>`;
}

function answer(correct){
 const w=quizWords[quizIndex];
 updateRecord(w.word,correct);
 if(correct)score++;
 quizIndex++;
 renderQuiz();
}

function startTest(type){
 mode=type;
 quizWords=shuffle(words.filter(x=>x.week===currentWeek));
 quizIndex=0;score=0;
 renderTest();
}

function renderTest(){
 const q=document.getElementById('quiz');
 if(quizIndex>=quizWords.length){finishQuiz();return;}
 const w=quizWords[quizIndex];
 const pct=Math.round((quizIndex/quizWords.length)*100);
 let body='';
 if(mode==='choice'){
   const options=shuffle([w.chinese,...shuffle(words.filter(x=>x.word!==w.word).map(x=>x.chinese)).slice(0,3)]);
   body=`<div class="word">${escapeHtml(w.word)}</div><button class="big-btn btn orange" onclick="speak('${escapeJs(w.word)}')">🔊 聽發音</button>
   <div class="answers">${options.map(x=>`<button class="answer" onclick="choiceAnswer('${escapeJs(x)}','${escapeJs(w.chinese)}')">${escapeHtml(x)}</button>`).join('')}</div>`;
 }else if(mode==='spell'){
   body=`<div class="meaning">${escapeHtml(w.chinese)}</div><input id="answerInput" placeholder="請輸入英文單字" autocomplete="off" onkeydown="if(event.key==='Enter')checkInput()"><br><br><button class="btn primary" onclick="checkInput()">確認</button><button class="btn orange" onclick="speak('${escapeJs(w.word)}')">🔊 聽發音</button>`;
 }else{
   body=`<div class="meaning">請聽發音後輸入單字</div><button class="big-btn btn orange" onclick="speak('${escapeJs(w.word)}')">🔊 播放</button><br><br><input id="answerInput" placeholder="請輸入你聽到的英文單字" autocomplete="off" onkeydown="if(event.key==='Enter')checkInput()"><br><br><button class="btn primary" onclick="checkInput()">確認</button>`;
 }
 q.innerHTML=`<div class="small">${escapeHtml(currentWeek)}　${quizIndex+1} / ${quizWords.length}</div><div class="progress"><div style="width:${pct}%"></div></div><div class="center">${body}</div><div class="center" style="margin-top:25px"><button class="btn" onclick="startWeek('${escapeJs(currentWeek)}')">↩ 回到單字卡</button></div>`;
}

function choiceAnswer(selected,correct){
 const ok=selected===correct;
 updateRecord(quizWords[quizIndex].word,ok);
 if(ok)score++;
 alert(ok?'✓ 答對了！':'✗ 答錯了，正確答案是：'+correct);
 quizIndex++;renderTest();
}

function checkInput(){
 const input=document.getElementById('answerInput');
 if(!input)return;
 const value=input.value.trim().toLowerCase();
 const correct=quizWords[quizIndex].word.toLowerCase();
 const ok=value===correct;
 updateRecord(quizWords[quizIndex].word,ok);
 if(ok)score++;
 alert(ok?'✓ 答對了！':'✗ 答錯了，正確答案是：'+quizWords[quizIndex].word);
 quizIndex++;renderTest();
}

function finishQuiz(){
 const q=document.getElementById('quiz');
 const total=quizWords.length;
 q.innerHTML=`<div class="center"><h2>🎉 複習完成</h2><div class="stat">${score} / ${total}</div><p>正確率：${Math.round(score/total*100)}%</p><button class="btn primary" onclick="startWeek('${escapeJs(currentWeek)}')">再複習一次</button><button class="btn" onclick="backToWeeks()">選其他 Week</button></div>`;
}

function backToWeeks(){
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('weekSelect').classList.remove('hidden');
 renderWeeks();
}

function updateRecord(word,correct){
 if(!records[word])records[word]={correct:0,wrong:0,last:''};
 if(correct)records[word].correct++;else records[word].wrong++;
 records[word].last=new Date().toLocaleString('zh-TW');
 save();
}

function speak(word){
 if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音播放。');return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(word);
 u.lang='en-US';
 u.rate=.8;
 u.pitch=1;
 speechSynthesis.speak(u);
}

function addWord(){
 const week=document.getElementById('newWeek').value.trim();
 const word=document.getElementById('newWord').value.trim();
 const chinese=document.getElementById('newChinese').value.trim();
 const example=document.getElementById('newExample').value.trim();
 if(!week||!word||!chinese){alert('請至少填寫 Week、英文單字、中文意思。');return;}
 words.push({id:Date.now(),week,word,chinese,example});
 save();
 document.getElementById('newWord').value='';
 document.getElementById('newChinese').value='';
 document.getElementById('newExample').value='';
 renderTable();renderWeeks();
 alert('新增成功！');
}

function addDemo(){
 const demo=[
 {week:'Week 1',word:'apple',chinese:'蘋果',example:'I eat an apple.'},
 {week:'Week 1',word:'banana',chinese:'香蕉',example:'I like bananas.'},
 {week:'Week 1',word:'orange',chinese:'柳橙',example:'This is an orange.'},
 {week:'Week 1',word:'school',chinese:'學校',example:'I go to school.'},
 {week:'Week 1',word:'teacher',chinese:'老師',example:'She is my teacher.'},
 {week:'Week 2',word:'beautiful',chinese:'美麗的',example:'It is beautiful.'},
 {week:'Week 2',word:'important',chinese:'重要的',example:'This is important.'},
 {week:'Week 2',word:'family',chinese:'家庭',example:'I love my family.'}
 ];
 demo.forEach(x=>words.push({...x,id:Date.now()+Math.random()}));
 save();renderTable();renderWeeks();alert('已載入範例單字！');
}

function renderTable(){
 const box=document.getElementById('wordTable');
 if(!words.length){box.innerHTML='<p>尚無資料。</p>';return;}
 box.innerHTML=`<table><thead><tr><th>Week</th><th>英文</th><th>中文</th><th>學習紀錄</th><th>操作</th></tr></thead><tbody>`+
 words.map((w,i)=>{
  const r=records[w.word]||{correct:0,wrong:0};
  return `<tr><td>${escapeHtml(w.week)}</td><td><b>${escapeHtml(w.word)}</b></td><td>${escapeHtml(w.chinese)}</td><td>✓ ${r.correct} / ✗ ${r.wrong}</td><td><button class="btn red" onclick="deleteWord(${i})">刪除</button></td></tr>`;
 }).join('')+'</tbody></table>';
}

function deleteWord(i){
 if(confirm('確定要刪除這個單字嗎？')){delete records[words[i].word];words.splice(i,1);save();renderTable();renderWeeks();renderStats();}
}

function renderStats(){
 const total=words.length;
 let c=0,w=0;
 words.forEach(x=>{const r=records[x.word]||{};c+=r.correct||0;w+=r.wrong||0;});
 const weak=words.map(x=>({x,r:records[x.word]||{correct:0,wrong:0}})).filter(a=>a.r.wrong>a.r.correct).sort((a,b)=>b.r.wrong-a.r.wrong).slice(0,10);
 document.getElementById('statsContent').innerHTML=`
 <div class="grid">
  <div class="card"><div class="small">單字總數</div><div class="stat">${total}</div></div>
  <div class="card"><div class="small">答對次數</div><div class="stat">${c}</div></div>
  <div class="card"><div class="small">答錯次數</div><div class="stat">${w}</div></div>
  <div class="card"><div class="small">整體正確率</div><div class="stat">${c+w?Math.round(c/(c+w)*100):0}%</div></div>
 </div>
 <h3>⚠ 需要加強的單字</h3>
 ${weak.length?'<table><tr><th>Week</th><th>單字</th><th>答對</th><th>答錯</th></tr>'+weak.map(a=>`<tr><td>${escapeHtml(a.x.week)}</td><td>${escapeHtml(a.x.word)}</td><td>${a.r.correct}</td><td>${a.r.wrong}</td></tr>`).join('')+'</table>':'<p>目前沒有需要加強的單字。</p>'}
 <br><button class="btn red" onclick="resetRecords()">清除學習紀錄</button>`;
}

function resetRecords(){if(confirm('確定清除所有學習紀錄嗎？單字不會被刪除。')){records={};save();renderStats();renderTable();}}

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function escapeJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}

renderWeeks();
renderTable();
renderStats();
</script>
</body>
</html>
