<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小芭樂的單字庫</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f5ff;--bg2:#fff4e0;--fg:#2b3350;--card:#fff;--pri:#4f8cff;--pri2:#2f6be0;--acc:#ff9f43;--bd:#bfd9f5;--ok:#1fa85a;--bad:#e8505b;--chip:#f0f7ff}

:root[data-theme="dark"]{--bg:#1b2238;--bg2:#2a2236;--fg:#eef1fb;--card:#262f4a;--pri:#6fa0ff;--pri2:#4f86f0;--acc:#ffb066;--bd:#43507a;--ok:#4cd68a;--bad:#ff7b84;--chip:#2f3a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:14px}
.hero{text-align:center;font-size:30px;font-weight:800;color:var(--pri2);margin:4px 0 12px;letter-spacing:2px}
.hero span{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(8deg)}}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
nav button{padding:12px 6px;border:3px solid var(--bd);background:var(--card);color:var(--fg);border-radius:18px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--bd);font-family:inherit}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri2);box-shadow:0 4px 0 var(--pri2)}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 6px 0 var(--bd)}
.card b{font-size:20px;color:var(--pri2)}
.weeks{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}
.weeks label{border:3px solid var(--bd);background:var(--chip);border-radius:999px;padding:7px 16px;cursor:pointer;user-select:none;font-weight:700}
.weeks label.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.weeks label.on::before{content:"✓ "}
.weeks input{display:none}
button.b{padding:12px 22px;border:0;border-radius:16px;background:var(--pri);color:#fff;font-size:19px;font-weight:800;cursor:pointer;margin:4px 6px 4px 0;box-shadow:0 5px 0 var(--pri2);font-family:inherit}
button.b:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri2)}
button.b.g{background:var(--card);color:var(--fg);border:3px solid var(--bd);box-shadow:0 4px 0 var(--bd);padding:9px 16px;font-size:17px}
#qstart{background:var(--ok);box-shadow:0 5px 0 rgba(0,0,0,.2);font-size:22px;padding:14px 28px}
#qrestart{border-color:var(--acc);color:var(--acc)}
#qsub{font-size:24px;padding:14px 32px;background:var(--acc);box-shadow:0 5px 0 rgba(0,0,0,.2)}
input[type=text],input[type=date]{font-size:30px;padding:14px;border:4px solid var(--bd);border-radius:18px;background:var(--chip);color:var(--fg);width:100%;box-sizing:border-box;text-align:center;font-family:inherit;outline:none}
input[type=text]:focus{border-color:var(--pri)}
input[type=date]{font-size:16px;width:auto;padding:6px 10px;text-align:left}
input[type=checkbox]{width:22px;height:22px;vertical-align:middle;accent-color:var(--acc)}
.big{text-align:center;margin:10px 0}
#qplay{font-size:28px;padding:16px 32px;border-radius:999px}
.fb{text-align:center;font-size:24px;font-weight:800;min-height:34px;margin:12px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hide{display:none!important}
.miss{color:var(--ok);font-weight:800;text-decoration:underline}.extra{color:var(--bad);text-decoration:line-through}
.fb div{margin:6px 0;font-size:26px;letter-spacing:1px;font-weight:700}
.fb .ph{font-size:20px;letter-spacing:0;opacity:.8}
.fb .muted{font-size:14px;letter-spacing:0;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:17px;margin-top:8px}
th{background:var(--chip);color:var(--pri2)}
th,td{padding:9px 10px;border-bottom:2px dashed var(--bd);text-align:left}
.sc{overflow-x:auto}
.muted{opacity:.7;font-size:15px}
h4{font-size:22px;color:var(--pri2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--bd)}
.row .w{font-size:24px;font-weight:800;min-width:140px}.row .p{flex:1;opacity:.75;font-size:19px}
.bar{height:18px;background:var(--chip);border:3px solid var(--bd);border-radius:999px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));border-radius:999px;transition:width .3s}
@media(max-width:480px){.hero{font-size:24px}.wrap{padding:10px}.row .w{min-width:100px;font-size:21px}}
</style></head><body><div class="wrap">
<div class="hero"><span>🌟</span> 小芭樂的單字庫 <span>🚀</span></div>
<nav id="nav"></nav>

<section id="s0"><div class="card">
<b>選擇單字表</b><div class="weeks" id="qset"></div><b>選擇測驗週次</b> <span class="muted" id="cwq"></span>

</div>

<div class="fb" id="qfb"></div>
<div><button class="b" id="qsub">✅ 確認答案</button></div></div>
<div class="card hide" id="qend"><b id="qsum"></b><div style="margin-top:8px"><button class="b" id="qretry">💪 錯題重複練習</button></div></div>
</section>

<section id="s1" class="hide"><div class="card"><b>選擇單字表</b><div class="weeks" id="sset"></div><b>選擇週次</b><div class="weeks" id="sw"></div>
<button class="b g" id="sall">全選</button><button class="b g" id="snone">全不選</button>
<div style="margin-top:8px" class="muted">測驗開始日期:<input type="date" id="d1"> ~ <input type="date" id="d2"></div></div>
<div class="card sc" id="sout"></div></section>

<section id="s2" class="hide"><div id="lout"></div></section>

<section id="s3" class="hide"><div class="card"><b>選擇單字表</b><div class="weeks" id="rset"></div><b>選擇週次</b> <span class="muted" id="cwr"></span><div class="weeks" id="rw"></div></div>
<div class="card" id="rout"></div></section>
</div>
<script>
const CET={
"1":"photographer|fəˈtɑgrəfər;all over|ɔl ˈoʊvər;moment|ˈmoʊmənt;occasion|əˈkeɪʒən;suit|sut;striking|ˈstraɪkɪŋ;hurtful|ˈhərtfəl;unusual|ənˈjuˌʒuəl;attractive|əˈtræktɪv;capture|ˈkæptʃər",
"2":"hockey|ˈhɑki;soccer|ˈsɑkər;country|ˈkəntri;popular|ˈpɑpjələr;the rest of|ðə rɛst əv;middle|ˈmɪdəl;university|ˌjunəˈvərsəti;athlete|ˈæθˌlit;interested in|ˈɪntəˌrɛstɪd ɪn;good at|gʊd æt",

"5":"roommate|ˈruˌmeɪt;questionnaire|kˌwɛstʃəˈnɛr;stay up|steɪ əp;messy|ˈmɛsi;talkative|ˈtɔkətɪv;outgoing|ˈaʊtˌgoʊɪŋ;private|ˈpraɪvət;easygoing|ˈiziˈgoʊɪŋ;bother|ˈbɑðər;upset|ˈəpˌsɛt",

"10":"international|ˌɪnərˈnæʃənɑl;across from|əˈkrɔs frəm;certain|ˈsərtən;look alike|lʊk əˈlaɪk;selfie|ˈsɛlˌfi;departure|dɪˈpɑrtʃər;arrival|ərˈaɪvəl;psychologist|saɪˈkɑlədʒəst;detective|dɪˈtɛktɪv;client|klaɪənt",
"11-12":"comedy|ˈkɑmədi;horror|ˈhɔrər;animation|ˌænəˈmeɪʃən;cough|kɔf;scene|sin;work on|wərk ɔn;go crazy|goʊ ˈkreɪzi;day off|deɪ ɔf;catch a cold|kætʃ ə koʊld;allergic|əˈlərdʒɪk",
"13-14":"feature|ˈfitʃər;waterproof|ˈwɔtərˌpruf;rarely|ˈrɛrli;text|tɛkst;run late|rən leɪt;popularity|ˌpɑpjəˈlɛrəti;connect|kəˈnɛkt;constantly|ˈkɑnstəntli;endless|ˈɛndləs;addicted|əˈdɪktɪd",
"15-16":"include|ˌɪnˈklud;luxury|ˈləgʒəri;aquarium|əkˈwɛriəm;underground|ˈəndərˌgraʊnd;ice rink|aɪs rɪŋk;theme park|θim pɑrk;parking space|ˈpɑrkɪŋ speɪs;system|ˈsɪstəm;locate|ˈloʊˌkeɪt;stereo|ˈstɛriˌoʊ",
"17":"difficult|ˈdɪfəkəlt;neat|nit;composition|ˌkɑmpəˈzɪʃən;excellent|ˈɛksələnt;handwriting|ˈhænˌdraɪtɪŋ;right there|raɪt ðɛr;absent|ˈæbsənt;recognize|ˈrɛkəgˌnaɪz;childhood|ˈtʃaɪlˌdhʊd;interpreter|ˌɪnˈtərprətər"};
const FET={
"1":"citizen|ˈsɪtɪzən;immigration|ˌɪməˈgreɪʃən;immigrant|ˈɪməgrənt;process|ˈprɔˌsɛs;interrogation|ˌɪnˌtɛrəˈgeɪʃən;admit|ədˈmɪt;prohibit|proʊˈhɪbət;detain|dɪˈteɪn;laborer|ˈleɪbərər;merchant|ˈmərtʃənt",
"2":"opportunity|ˌɑpərˈtunəti;passport|ˈpæˌspɔrt;scholar|ˈskɑlər;diplomat|ˈdɪpləˌmæt;resemblance|rɪˈzɛmbləns;testify|ˈtɛstɪˌfaɪ;witness|ˈwɪtnəs;transcript|ˈtrænˌskrɪpt;affidavit|ˌæfəˈdeɪvət;deportation|ˌdipɔrˈteɪʃən",
"3":"arrangement|ərˈeɪndʒmənt;pin|pɪn;coordinate|koʊˈɔrdəˌneɪt;claim|kleɪm;related|rɪˈleɪtɪd;nephew|ˈnɛfju;eldest|ˈɛldəst;peculiarity|pɪˌkjuliˈɛrəti;suspect|ˈsəˌspɛkt;reveal|rɪˈvil",
"4":"report|rɪˈpɔrt;exclusion|ɪkˈskluʒən;act|ækt;identity|aɪˈdɛntəˌti;certificate|sərˈtɪfɪkət;make certain|meɪk ˈsərtən;estimate|ˈɛstəˌmeɪt;experience|ɪkˈspɪriəns;consider|kənˈsɪdər;official|əˈfɪʃəl",
"5":"journal|ˈdʒərnəl;discrimination|dɪˌskrɪməˈneɪʃən;segregation|ˌsɛgrəˈgeɪʃən;Jim Crow laws|dʒɪm kroʊ lɔz;crop|krɑp;sharecropper|ˈʃɛrˌkrɑpər;cotton|ˈkɔtən;boll weevil|boʊl ˈwivəl;war effort|wɔr ˈɛfərt;integrated|ˈɪnəˌgreɪtɪd",
"6":"current|ˈkɑrənt;harvest|ˈhɑrvəst;fertilizer|ˈfərtəˌlaɪzər;plow|plaʊ;owe|oʊ;rent|rɛnt;debt|dɛt;platform|ˈplætˌfɔrm;assembly line|əˈsɛmbli laɪn;manufacture|ˌmænjəˈfæktʃər",
"7":"community|kəmˈjunɪti;furniture|ˈfərnɪtʃər;bunk bed|bəŋk bɛd;flight of stairs|flaɪt əv stɛrz;mile|maɪl;soak|soʊk;mutter|ˈmətər;chuckle|ˈtʃəkəl;talk back|tɔk bæk;ethnicity|ɛθˈnɪsɪti",
"8":"struggling|ˈstrəgəlɪŋ;frown|fraʊn;disrespectful|ˌdɪsrɪˈspɛktfəl;percentage|pərˈsɛnɪdʒ;expect|ɪkˈspɛkt;cross one's fingers|krɔs wənz ˈfɪŋgərz;belongings|bɪˈlɔŋɪŋz;countryside|ˈkəntriˌsaɪd;resident|ˈrɛzɪdənt;get used to|gɪt juzd tɪ",
"10":"native|ˈneɪtɪv;habitat|ˈhæbəˌtæt;population|ˌpɑpjəˈleɪʃən;restore|rɪˈstɔr;comeback|ˈkəmˌbæk;migrating|ˈmaɪˌgreɪtɪŋ;creature|ˈkritʃər;chemical|ˈkɛmɪkəl;poison|ˈpɔɪzən;fungus|ˈfəŋgəs",
"11":"sensitive|ˈsɛnsɪtɪv;harm|hɑrm;extinct|ɪkˈstɪŋkt;atmosphere|ˈætməsˌfɪr;global warming|ˈgloʊbəl ˈwɔrmɪŋ;fossil fuel|ˈfɑsəl fjuəl;deformed|dɪˈfɔrmd;shrink|ʃrɪŋk;depend on|dɪˈpɛnd ɔn;food chain|fud tʃeɪn",
"12":"shrub|ʃrəb;fence|fɛns;temporary|ˈtɛmpərˌɛri;shallow|ˈʃæloʊ;wetlands|ˈwɛˌtlændz;woodlands|ˈwʊˌdlændz;convince|kənˈvɪns;propose|prəˈpoʊz;force|fɔrs;devour|dɪˈvaʊər",
"13":"introduce|ˌɪntrəˈdus;spotted|ˈspɑtɪd;burrow|bəroʊ;dozen|ˈdəzən;disease|dɪˈziz;develop|dɪˈvɛləp;drain|dreɪn;dump|dəmp;damage|ˈdæmɪdʒ;disappear|ˌdɪsəˈpɪr",
"14":"hatchet|ˈhætʃət;fend for one's self|fɛnd fər wənz sɛlf;ignite|ˌɪgˈnaɪt;sputter|ˈspətər;painstaking|ˈpeɪnˌsteɪkɪŋ;gratify|ˈgrætəˌfaɪ;self-pity|sɛlf ˈpɪti;calf|kæf;gingerly|ˈdʒɪndʒərli;jerk|dʒərk",
"15":"flammable|ˈflæməbəl;kindling|ˈkɪndlɪŋ;bark|bɑrk;birch tree|bərtʃ tri;match|mætʃ;strike|straɪk;smolder|sˈmoʊldər;accomplish|əˈkɑmplɪʃ;frustration|frəˈstreɪʃən;wince|wɪns",
"16":"cave dweller|keɪv dˈwɛlər;examine|ɪgˈzæmɪn;staff|stæf;doze|doʊz;gesture|ˈdʒɛstʃər;register|ˈrɛdʒɪstər;stumble|ˈstəmbəl;rot|rɑt;quill|kwɪl;injury|ˈɪndʒəri",
"17":"spark|spɑrk;charcoal|ˈtʃɑrˌkoʊl;glow|gloʊ;flue|flu;fine|faɪn;fluff|fləf;twig|twɪg;position|pəˈzɪʃən;limp|lɪmp;nick|nɪk"};
const G=[],GM={};
[["CET",CET],["FET",FET]].forEach(([s,R])=>Object.keys(R).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(k=>{
 const[a,b]=k.split("-").map(Number),f=a,t=b||a,g={id:s[0]+k,set:s,from:f,to:t,label:s+" 第"+(f===t?f:f+"&"+t)+"週",
 words:R[k].split(";").map(x=>{const[w,p]=x.split("|");return{w,p}})};G.push(g);GM[g.id]=g}));
const $=id=>document.getElementById(id);
const t0=new Date();t0.setHours(0,0,0,0);
const CUR=Math.floor(Math.round((t0-new Date(2026,7,31))/864e5)/7)+1;
const hit=(g,w)=>w>=g.from&&w<=g.to;
const prevCur=set=>G.filter(g=>(!set||g.set===set)&&(hit(g,CUR)||hit(g,CUR-1))).map(g=>g.id);
let tests=[];try{tests=JSON.parse(localStorage.getItem("vq_tests_g5")||"[]")}catch(e){}
tests.forEach(t=>{t.log.forEach(l=>{if(!l.g){const g=G.find(g=>g.set==="FET"&&g.words.some(x=>x.w===l.w));l.g=g?g.id:"F?"}});
 t.weeks=t.weeks.map(x=>typeof x==="number"?"F"+x:x)});
const save=()=>{try{localStorage.setItem("vq_tests_g5",JSON.stringify(tests))}catch(e){}};
const fmt=ts=>{const d=new Date(ts),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\//g,","));u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const norm=s=>s.toLowerCase().trim().replace(/\s*\/\s*/g," / ").replace(/\s+/g," ");
const gl=id=>GM[id]?GM[id].label:id;

function chips(id,items,isOn,click){const c=$(id);c.innerHTML="";items.forEach(([k,txt])=>{const l=document.createElement("label");l.textContent=txt;l.className=isOn(k)?"on":"";l.onclick=e=>{e.preventDefault();click(k)};c.appendChild(l)})}
const wkChips=(id,set,sel,cb)=>chips(id,G.filter(g=>!set||g.set===set).map(g=>[g.id,set?g.label.slice(4):g.label]),k=>sel.has(k),k=>{sel.has(k)?sel.delete(k):sel.add(k);wkChips(id,set,sel,cb);cb&&cb()});
const order=sel=>G.filter(g=>sel.has(g.id)).map(g=>g.id);

const TABS=["✏️ 測驗","📊 學習統計","🏅 學習狀況","📖 單字複習"];
TABS.forEach((n,i)=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>show(i);$("nav").appendChild(b)});
function show(i){TABS.forEach((_,j)=>{$("s"+j).classList.toggle("hide",i!==j);$("nav").children[j].classList.toggle("on",i===j)});if(i===1)stats();if(i===2)status();if(i===3)review()}
const setChips=(id,cur,cb)=>chips(id,[["CET","CET"],["FET","FET"]],k=>k===cur,k=>{cb(k)});

// quiz
let qSet="CET";const qSel=new Set(prevCur(qSet));
function qRender(){setChips("qset",qSet,k=>{qSet=k;qSel.clear();prevCur(k).forEach(x=>qSel.add(x));qRender()});wkChips("qw",qSet,qSel)}
$("cwq").textContent="(目前第 "+CUR+" 週)";qRender();
const setQ=a=>{qSel.clear();a.forEach(w=>qSel.add(w));wkChips("qw",qSet,qSel)};
$("qprev").onclick=()=>setQ(prevCur(qSet));$("qall").onclick=()=>setQ(G.filter(g=>g.set===qSet).map(g=>g.id));$("qnone").onclick=()=>setQ([]);
let T=null,queue=[],idx=0,wrong=[],locked=false,base=[],note="";
const msg=t=>{$("qmsg").textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$("qmsg").textContent="",3000)};
function wrongWords(ids){const last={};tests.slice().sort((a,b)=>a.id-b.id).forEach(t=>t.log.forEach(l=>{last[l.g+"|"+l.w]=l.ok}));
 return Object.keys(last).filter(k=>!last[k]).map(k=>{const i=k.indexOf("|");return{g:k.slice(0,i),w:k.slice(i+1)}}).filter(x=>ids.includes(x.g))}
function begin(){if(!qSel.size){msg("請先選擇週次");return}
 const ids=order(qSel),on=$("qwrong").checked,wr=on?wrongWords(ids):[];
 base=wr.length?wr:ids.flatMap(id=>GM[id].words.map(x=>({w:x.w,g:id})));
 note=on?(wr.length?`錯題重複練習:共 ${wr.length} 題`:"所選週次目前沒有錯題,改為隨機出題"):"";launch(ids)}
function launch(ids){T={id:Date.now(),set:qSet,weeks:ids,log:[]};tests.push(T);save();round(shuffle(base));$("qnote").textContent=note}
function round(list){queue=list;idx=0;wrong=[];$("qend").classList.add("hide");$("qbox").classList.remove("hide");next()}
function next(){if(idx>=queue.length){$("qbox").classList.add("hide");$("qend").classList.remove("hide");
 $("qsum").textContent=wrong.length?`本輪完成!🎈 答錯 ${wrong.length} / ${queue.length} 題`:`🏆 太棒了!本輪全部答對 (${queue.length} 題)`;
 $("qretry").classList.toggle("hide",!wrong.length);return}
 locked=false;$("qsub").textContent="✅ 確認答案";$("qin").value="";$("qin").disabled=false;$("qfb").textContent="";$("qfb").className="fb";
 const it=queue[idx];$("qprog").textContent=`第 ${idx+1} / ${queue.length} 題`+(it.w.includes("/")?"(此題有兩個形態,請用 / 分隔,如 a / b)":"");
 $("qbar").style.width=(idx/queue.length*100)+"%";$("qin").focus();speak(it.w)}
function submit(){if(locked){idx++;next();return}
 const it=queue[idx],ok=norm($("qin").value)===norm(it.w);
 T.log.push({w:it.w,g:it.g,ok});save();locked=true;$("qin").disabled=true;$("qsub").textContent="➡️ 下一題";
 const [A,B]=diffHTML(it.w,$("qin").value),px=GM[it.g]&&GM[it.g].words.find(x=>x.w===it.w),P=px&&px.p?` <span class="ph">(${px.p})</span>`:"";
 if(ok){$("qfb").className="fb ok";$("qfb").innerHTML=`🎉 答對了!太棒了!<div>正確答案:<b>${A}</b>${P}</div>`}
 else{wrong.push(it);$("qfb").className="fb bad";$("qfb").innerHTML=`💪 沒關係,再加油!<div>你的答案:${B||"(空白)"}</div><div>正確答案:<b>${A}</b>${P}</div><div class="muted">綠色底線 = 漏掉或打錯的正確字母;紅色刪除線 = 多打或打錯的字母</div>`}}
function diffHTML(a,b){const x=norm(a),y=norm(b),n=x.length,m=y.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));
 const e=c=>c===" "?"&nbsp;":c.replace(/[&<>"]/g,k=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[k]));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=x[i]===y[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
 let i=0,j=0,A="",B="";
 while(i<n||j<m){if(i<n&&j<m&&x[i]===y[j]){A+=e(a[i]);B+=e(y[j]);i++;j++}
  else if(j>=m||(i<n&&d[i+1][j]>=d[i][j+1])){A+=`<u class="miss">${e(a[i])}</u>`;i++}
  else{B+=`<s class="extra">${e(y[j])}</s>`;j++}}
 return[A,B]}
$("qstart").onclick=begin;$("qsub").onclick=submit;
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("qbox").classList.contains("hide")){e.preventDefault();submit()}});
$("qplay").onclick=()=>{speak(queue[idx].w);$("qin").focus()};
$("qretry").onclick=()=>round(shuffle(wrong));
$("qrestart").onclick=()=>{if(!T){msg("尚未開始測驗");return}try{speechSynthesis.cancel()}catch(e){}const ids=T.weeks;tests=tests.filter(t=>t!==T);qSet=T.set||qSet;launch(ids)};

// stats
let sSet="CET";const sSel=new Set(prevCur(sSet));
function sR(){setChips("sset",sSet,k=>{sSet=k;sSel.clear();prevCur(k).forEach(x=>sSel.add(x));sR();stats()});wkChips("sw",sSet,sSel,stats)}sR();
$("sall").onclick=()=>{G.filter(g=>g.set===sSet).forEach(g=>sSel.add(g.id));sR();stats()};$("snone").onclick=()=>{sSel.clear();sR();stats()};$("d1").onchange=stats;$("d2").onchange=stats;
function tbl(rows){return`<table><tr><th>單字</th><th>單字表/週</th><th>測驗次</th><th>答錯</th><th>答錯率</th></tr>`+rows.map(r=>`<tr><td>${r.w}</td><td>${gl(r.g)}</td><td>${r.n}</td><td>${r.x}</td><td>${Math.round(r.x/r.n*100)}%</td></tr>`).join("")+"</table>"}
const agg=log=>{const m={};log.forEach(l=>{const k=l.g+"|"+l.w,o=m[k]||(m[k]={w:l.w,g:l.g,n:0,x:0});o.n++;if(!l.ok)o.x++});return Object.values(m).sort((a,b)=>b.x/b.n-a.x/a.n||b.x-a.x)};
function stats(){const a=$("d1").value?new Date($("d1").value+"T00:00:00").getTime():0,b=$("d2").value?new Date($("d2").value+"T23:59:59").getTime():Infinity;
 if(!sSel.size){$("sout").innerHTML='<span class="muted">請選擇要查看的週次</span>';return}
 const log=tests.filter(t=>t.id>=a&&t.id<=b).flatMap(t=>t.log).filter(l=>sSel.has(l.g));
 $("sout").innerHTML=log.length?tbl(agg(log)):'<span class="muted">此條件下沒有測驗紀錄</span>'}

// status
function status(){const c=$("lout");if(!tests.length){c.innerHTML='<div class="card muted">尚無測驗紀錄</div>';return}
 c.innerHTML=tests.slice().sort((a,b)=>b.id-a.id).map(t=>{const x=t.log.filter(l=>!l.ok).length;
 return`<div class="card sc"><b>${fmt(t.id)}</b> <span class="muted">${t.weeks.map(gl).join("、")}|作答 ${t.log.length} 次,答錯 ${x} 次</span>`+(t.log.length?tbl(agg(t.log)):"")+"</div>"}).join("")}

// review
let rSet="CET";const rSel=new Set(prevCur(rSet));
function rRender(){setChips("rset",rSet,k=>{rSet=k;rSel.clear();prevCur(k).forEach(x=>rSel.add(x));rRender()});wkChips("rw",rSet,rSel,review);review()}
$("cwr").textContent="(目前第 "+CUR+" 週,已自動勾選前週及當週)";
function review(){const ids=order(rSel);
 $("rout").innerHTML=ids.length?ids.map(id=>`<h4 style="margin:10px 0 0">${GM[id].label}</h4>`+GM[id].words.map((x,i)=>`<div class="row"><span class="w">${x.w}</span><span class="p">${x.p?"/"+x.p+"/":""}</span><button class="b g" data-s="${id}|${i}">🔊</button></div>`).join("")).join(""):'<span class="muted">請選擇週次</span>'}
$("rout").onclick=e=>{const s=e.target.dataset&&e.target.dataset.s;if(s){const[g,i]=s.split("|");speak(GM[g].words[i].w)}};
rRender();show(0);
</script></body></html>
